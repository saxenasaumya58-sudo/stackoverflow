name: Deploy nested frontend to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps (nested path)
        run: npm ci --prefix "n8n workflow/ai-document-orchestrator/frontend"

      - name: Build frontend (nested path)
        run: npm run build --prefix "n8n workflow/ai-document-orchestrator/frontend"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./"n8n workflow/ai-document-orchestrator"/frontend/dist
